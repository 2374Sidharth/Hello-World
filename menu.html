<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | Suryaa Home Style</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Common CSS -->
  <link rel="stylesheet" href="commonstyle.css">

  <style>
    .menu {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .menu h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .price {
      font-weight: 600;
      color: #ff5722;
    }
  </style>
</head>
<body>

  <header>
    <h1>Suryaa Home Style</h1>
  </header>

  <section class="menu">
    <h2>🍽️ Our Menu</h2>

    <div class="menu-item">
      <span>Veg Meals</span>
      <span class="price">₹120</span>
    </div>

    <div class="menu-item">
      <span>Chicken Briyani</span>
      <span class="price">₹180</span>
    </div>

    <div class="menu-item">
      <span>Mutton Briyani</span>
      <span class="price">₹240</span>
    </div>

    <div class="menu-item">
      <span>Chicken 65</span>
      <span class="price">₹150</span>
    </div>

    <div class="menu-item">
      <span>Egg Rice</span>
      <span class="price">₹110</span>
    </div>

  </section>

</body>
</html>
